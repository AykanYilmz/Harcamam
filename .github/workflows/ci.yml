name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the Codecov upload prove which repository it comes from, without a token.
      id-token: write
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harcamam
          POSTGRES_PASSWORD: harcamam
          POSTGRES_DB: harcamam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harcamam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://harcamam:harcamam@localhost:5432/harcamam
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-hs256
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          black --check .
      - name: Migrations match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (fails below 80% coverage)
        run: pytest --cov --cov-report=xml --cov-report=term
      - uses: codecov/codecov-action@v5
        with:
          files: backend/coverage.xml
          flags: backend
          use_oidc: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - run: npm test
      - name: Type check and build
        run: npm run build

  images:
    name: production images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target prod --tag hesapkitap-backend backend
      - run: docker build --target prod --tag hesapkitap-web frontend
