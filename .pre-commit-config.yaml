repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # tsconfig files are JSONC (they allow comments).
        exclude: tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^backend/

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        files: ^backend/

  # Frontend hooks use the project's own node_modules (run `npm install` in frontend/ first).
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
        pass_filenames: false
      - id: prettier
        name: prettier
        entry: npm --prefix frontend run format:check
        language: system
        files: ^frontend/
        pass_filenames: false
