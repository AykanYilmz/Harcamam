services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-harcamam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-harcamam}
      POSTGRES_DB: ${POSTGRES_DB:-harcamam}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    # Apply pending migrations before starting the dev server.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-harcamam}:${POSTGRES_PASSWORD:-harcamam}@db:5432/${POSTGRES_DB:-harcamam}
      CORS_ORIGINS: '["http://localhost:5173"]'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # File change events don't reach containers from Windows bind mounts reliably.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_USE_POLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's Linux node_modules instead of the host's.
      - /app/node_modules
    depends_on:
      - backend

  # Development mail server: catches every email the app sends (nothing is delivered).
  # Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
