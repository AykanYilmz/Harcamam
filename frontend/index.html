<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HesapKitap</title>
    <script>
      // Apply the saved theme and motion choice before the first paint, so a dark page never
      // flashes white. Same storage keys and rules as src/theme/ThemeProvider.tsx.
      try {
        var theme = localStorage.getItem('harcamam.theme')
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)

        var motion = localStorage.getItem('harcamam.motion')
        var reduce =
          motion === 'off' ||
          (motion !== 'on' && window.matchMedia('(prefers-reduced-motion: reduce)').matches)
        if (reduce) document.documentElement.dataset.motion = 'reduce'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
